name: Preveri proste termine

on:
  schedule:
    # Vsakih 15 minut; znotraj zagona skripta preveri 3x na 5 minut,
    # tako da je dejanska granularnost ~5 min tudi ob zamudah GitHubovega planerja.
    - cron: "*/15 * * * *"
  workflow_dispatch:        # rocni zagon iz zavihka Actions

permissions:
  contents: write           # da lahko commita state.json

concurrency:
  group: preveri-termine
  cancel-in-progress: false

jobs:
  preveri:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Preveri termine
        id: check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEEKS_AHEAD: "15"
          REPEAT: "3"
          REPEAT_SLEEP: "300"
        run: python checker.py

      - name: Shrani stanje
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "stanje terminov: $(date -u '+%Y-%m-%d %H:%M')Z [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          else
            echo "Stanje nespremenjeno."
          fi
