name: Preveri proste termine

on:
  schedule:
    # GitHubov planer je "best effort": zamujene sprozitve PRESKOCI, ne postavi
    # v vrsto, zato je "*/15" v praksi pomenil zagon na ~2 uri. Namesto pogostih
    # kratkih zagonov imamo zato en DOLG zagon na uro, ki znotraj sebe preveri
    # 11x na 5 minut (REPEAT x REPEAT_SLEEP = ~55 min pokritosti).
    # Ce bi bile luknje se prevelike, pomaga "*/30 * * * *": concurrency spodaj
    # preprecuje prekrivanje, dodatna sprozitev samo pocaka in zapre luknjo.
    - cron: "*/15 * * * *"
  workflow_dispatch:        # rocni zagon iz zavihka Actions

permissions:
  contents: write           # da lahko commita state.json

concurrency:
  group: preveri-termine
  cancel-in-progress: false

jobs:
  preveri:
    runs-on: ubuntu-latest
    timeout-minutes: 70       # zagon traja ~56 min, pustimo rezervo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Preveri termine
        id: check
        env:
          PYTHONUNBUFFERED: "1"
          # --- izbereš kanal(e): nastavi samo tiste secrete, ki jih rabiš ---
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          # ------------------------------------------------------------------
          WEEKS_AHEAD: "15"
          REPEAT: "13"        #13 pregledov na zagon
          REPEAT_SLEEP: "300" # na 5 minut  ->  ~55 min pokritosti
        run: python checker.py

      - name: Shrani stanje
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "stanje terminov: $(date -u '+%Y-%m-%d %H:%M')Z [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          else
            echo "Stanje nespremenjeno."
          fi
